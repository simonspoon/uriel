name: Feature request
description: Suggest an idea or improvement for Uriel.Profiler.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? API sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Fit with Uriel's contract
      options:
        - label: This keeps the hot path non-blocking / non-throwing.
        - label: This stays release-safe (no debugger, no `#if DEBUG`).
